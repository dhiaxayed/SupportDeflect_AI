# Canonical Alembic script-location configuration; env.py resolves the effective runtime database URL.
# CLI commands normally run from backend/ so application imports and relative native paths agree.
[alembic]
# Anchor version files to this INI's directory even when the invoking working directory differs.
script_location = %(here)s/alembic
# Make the current backend directory importable for model metadata and runtime settings.
prepend_sys_path = .
